<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>درب الإنجليزي</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="خطة ٩٠ يوم لتعلم الإنجليزي على شكل لعبة: ٩٠٠ كلمة، ألعاب، استماع بدون موسيقى، واختبار يومي.">
<meta name="theme-color" content="#17875A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1511" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="درب">
<meta property="og:title" content="درب الإنجليزي">
<meta property="og:description" content="تعلم الإنجليزي من الصفر في ٩٠ يوم، على شكل لعبة.">
<meta property="og:image" content="icons/og.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
@font-face{font-family:Bahij;font-weight:300;font-display:swap;src:url("fonts/bahij-300.ttf") format("truetype")}
@font-face{font-family:Bahij;font-weight:400;font-display:swap;src:url("fonts/bahij-400.ttf") format("truetype")}
@font-face{font-family:Bahij;font-weight:600;font-display:swap;src:url("fonts/bahij-600.ttf") format("truetype")}
@font-face{font-family:Bahij;font-weight:800;font-display:swap;src:url("fonts/bahij-800.ttf") format("truetype")}
@font-face{font-family:Bahij;font-weight:900;font-display:swap;src:url("fonts/bahij-900.ttf") format("truetype")}
/* Layout: a single-column learning "trail" — winding day nodes per level, with full-screen activity sheets over it. */
:root{
  --bg:#EEF3F0; --surface:#FFFFFF; --sunken:#E3EBE6; --line:#D2DDD6;
  --ink:#10231A; --muted:#5B6E64; --faint:#8FA098;
  --l1:#17875A; --l1-deep:#0E6341; --l1-soft:#D6F0E3;
  --l2:#1D6BB5; --l2-deep:#134D86; --l2-soft:#D7E7F7;
  --l3:#D8612A; --l3-deep:#A5441A; --l3-soft:#FBE3D6;
  --gold:#F0AE22; --gold-deep:#C0860C; --gold-soft:#FDF0CF;
  --ok:#1E9E5A; --ok-soft:#DDF5E7; --bad:#D6453D; --bad-soft:#FBE1DF;
  --lv:var(--l1); --lv-deep:var(--l1-deep); --lv-soft:var(--l1-soft);
  --ar:"Bahij","Tajawal",system-ui,sans-serif;
  --en:"Bahij","Tajawal",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1511; --surface:#15211B; --sunken:#1C2A23; --line:#27382F;
  --ink:#E4EEE8; --muted:#9AB0A4; --faint:#6D8277;
  --l1:#2BB57A; --l1-deep:#16784F; --l1-soft:#173A2A;
  --l2:#4B97E0; --l2-deep:#23609C; --l2-soft:#17304A;
  --l3:#F08048; --l3-deep:#A9501F; --l3-soft:#3D2417;
  --gold:#F4BB3F; --gold-deep:#A87A12; --gold-soft:#3A2F12;
  --ok:#35C274; --ok-soft:#163726; --bad:#F06A60; --bad-soft:#3E1D1B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1511; --surface:#15211B; --sunken:#1C2A23; --line:#27382F;
  --ink:#E4EEE8; --muted:#9AB0A4; --faint:#6D8277;
  --l1:#2BB57A; --l1-deep:#16784F; --l1-soft:#173A2A;
  --l2:#4B97E0; --l2-deep:#23609C; --l2-soft:#17304A;
  --l3:#F08048; --l3-deep:#A9501F; --l3-soft:#3D2417;
  --gold:#F4BB3F; --gold-deep:#A87A12; --gold-soft:#3A2F12;
  --ok:#35C274; --ok-soft:#163726; --bad:#F06A60; --bad-soft:#3E1D1B;
  color-scheme:dark}
.lv-l1{--lv:var(--l1);--lv-deep:var(--l1-deep);--lv-soft:var(--l1-soft)}
.lv-l2{--lv:var(--l2);--lv-deep:var(--l2-deep);--lv-soft:var(--l2-soft)}
.lv-l3{--lv:var(--l3);--lv-deep:var(--l3-deep);--lv-soft:var(--l3-soft)}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--ar);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
p{margin:0}
svg.i{width:1.2em;height:1.2em;flex:none;vertical-align:middle}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;margin-inline-end:auto}
.brand .mark{width:32px;height:32px;border-radius:10px;background:var(--lv);display:grid;place-items:center;color:#fff}
.chip{display:flex;align-items:center;gap:5px;font-weight:800;font-family:var(--en);font-size:15px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.chip.fire{color:#E4572E}.chip.xp{color:var(--gold-deep)}
:root[data-theme="dark"] .chip.xp{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.xp{color:var(--gold)}}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--muted)}

/* level switch */
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:16px 14px}
.lvbtn{padding:10px 6px 9px;border-radius:14px;background:var(--surface);border:2px solid var(--line);text-align:center;line-height:1.25;position:relative}
.lvbtn b{display:block;font-size:15px;font-weight:800}
.lvbtn small{color:var(--muted);font-size:12px}
.lvbtn[aria-pressed="true"]{border-color:var(--lv);background:var(--lv-soft)}
.lvbtn[aria-pressed="true"] b{color:var(--lv-deep)}
:root[data-theme="dark"] .lvbtn[aria-pressed="true"] b{color:var(--lv)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lvbtn[aria-pressed="true"] b{color:var(--lv)}}
.lvbtn .lk{position:absolute;top:6px;inset-inline-start:8px;color:var(--faint)}

/* goal + hero */
.hero{background:var(--lv);color:#fff;border-radius:22px;padding:18px;display:grid;gap:12px;box-shadow:0 5px 0 var(--lv-deep)}
.hero .row{display:flex;align-items:center;gap:14px}
.hero .num{font-family:var(--en);font-weight:800;font-size:44px;line-height:1;min-width:64px;text-align:center;background:rgba(255,255,255,.16);border-radius:16px;padding:10px 6px}
.hero .num small{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;opacity:.85;margin-bottom:4px}
.hero h2{font-size:22px;font-weight:900}
.hero .enl{opacity:.9;font-size:15px}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .5s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:17px;padding:13px 20px;border-radius:16px;background:var(--lv);color:#fff;box-shadow:0 4px 0 var(--lv-deep);transition:transform .08s,box-shadow .08s;width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lv-deep)}
.btn.white{background:#fff;color:var(--lv-deep);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.gold{background:var(--gold);color:#3B2A00;box-shadow:0 4px 0 var(--gold-deep)}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{font-size:15px;padding:9px 14px;border-radius:12px;width:auto}

.goal{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:14px}
.goal .ring{width:46px;height:46px;flex:none}
.goal b{font-weight:800}
.goal p{color:var(--muted);font-size:14px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.qbtn{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:start;min-width:0}
.qbtn .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.qbtn b{display:block;font-size:15px;font-weight:800}
.qbtn small{display:block;color:var(--muted);font-size:12px;line-height:1.3}

/* trail */
.trail{position:relative;margin-top:26px;display:grid;gap:4px}
.week{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:800;font-size:14px;margin-block:18px 8px}
.week::before,.week::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
.nodeRow{display:flex;justify-content:center;height:84px;align-items:center}
.node{position:relative;width:70px;height:66px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);color:var(--faint);box-shadow:0 6px 0 var(--line);font-family:var(--en);font-weight:800;font-size:22px;transition:transform .1s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.node.open{background:var(--lv);color:#fff;box-shadow:0 6px 0 var(--lv-deep)}
.node.done{background:var(--gold);color:#3B2A00;box-shadow:0 6px 0 var(--gold-deep)}
.node.cur::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--lv);opacity:.35;animation:pulse 1.6s infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.5}100%{transform:scale(1.12);opacity:0}}
.node .stars{position:absolute;bottom:-26px;display:flex;gap:1px;color:var(--gold)}
.node .stars svg{width:14px;height:14px}
.node .tag{position:absolute;top:-10px;inset-inline-end:-18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;font-family:var(--ar);font-size:11px;font-weight:800;padding:1px 7px;white-space:nowrap}
.bubble{position:absolute;bottom:calc(100% + 14px);background:var(--surface);color:var(--lv-deep);border:2px solid var(--line);font-family:var(--ar);font-size:13px;font-weight:800;padding:3px 10px;border-radius:10px;white-space:nowrap;animation:bob 1.4s ease-in-out infinite}
:root[data-theme="dark"] .bubble{color:var(--lv)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bubble{color:var(--lv)}}
@keyframes bob{50%{transform:translateY(-4px)}}

/* sheets */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.shead{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.shead .wrap{display:flex;align-items:center;gap:12px;width:100%;padding-block:0}
.shead h3{font-size:18px;font-weight:900;flex:1;min-width:0}
.prog{flex:1;height:14px;border-radius:99px;background:var(--sunken);overflow:hidden}
.prog i{display:block;height:100%;background:var(--lv);border-radius:99px;transition:width .35s}
.sbody{padding-top:18px}

/* day page */
.dayhead{display:grid;gap:4px;margin-bottom:16px}
.dayhead .kick{color:var(--lv-deep);font-weight:800;font-size:14px;letter-spacing:.02em}
:root[data-theme="dark"] .dayhead .kick{color:var(--lv)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dayhead .kick{color:var(--lv)}}
.dayhead h2{font-size:26px;font-weight:900}
.missions{display:grid;gap:10px}
.mis{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px;text-align:start;width:100%}
.mis .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--lv-soft);color:var(--lv-deep);flex:none}
:root[data-theme="dark"] .mis .ic{color:var(--lv)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mis .ic{color:var(--lv)}}
.mis .tx{flex:1;min-width:0}
.mis b{display:block;font-weight:800;font-size:16px}
.mis small{display:block;color:var(--muted);font-size:13px;line-height:1.45}
.mis .xpb{font-family:var(--en);font-weight:800;font-size:13px;color:var(--gold-deep);background:var(--gold-soft);border-radius:8px;padding:2px 7px;flex:none}
:root[data-theme="dark"] .mis .xpb{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mis .xpb{color:var(--gold)}}
.mis.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.mis.done .ic{background:var(--ok);color:#fff}
.mis .step{font-family:var(--en);font-weight:800;color:var(--faint);font-size:13px;width:18px;text-align:center;flex:none}
.sec{margin-top:26px}
.sec>h3{font-size:18px;font-weight:900;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec>h3 small{font-weight:400;color:var(--muted);font-size:13px}
.wtable{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wrow{display:grid;grid-template-columns:40px 1fr 1fr;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow .w{font-family:var(--en);font-weight:600;font-size:17px;direction:ltr;text-align:right}
.wrow .p{color:var(--muted);font-size:13px}
.wrow .a{font-weight:800;font-size:15px}
.play{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--lv-soft);color:var(--lv-deep)}
:root[data-theme="dark"] .play{color:var(--lv)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .play{color:var(--lv)}}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;color:var(--ink)}
.note p+p{margin-top:8px}
.note.gold{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 40%,var(--line))}

/* rule */
.rule h2{font-size:24px;font-weight:900;margin-bottom:10px}
.rule .x{font-size:17px;line-height:1.8}
.exs{display:grid;gap:10px;margin-top:16px}
.ex{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.ex .e{font-family:var(--en);font-weight:600;font-size:19px;direction:ltr;text-align:right}
.ex .tx{flex:1;min-width:0}
.ex small{display:block;color:var(--muted);font-size:14px}

/* flashcard */
.card3d{perspective:1200px;margin-top:6px}
.fc{position:relative;height:320px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;background:var(--surface);border:2px solid var(--line);box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--lv-soft);border-color:var(--lv)}
.face .big{font-family:var(--en);font-size:clamp(30px,9vw,44px);font-weight:800;direction:ltr;line-height:1.15}
.face .pr{color:var(--muted);font-size:18px}
.face .arb{font-size:34px;font-weight:900}
.face .hint{position:absolute;bottom:14px;color:var(--faint);font-size:13px}
.dots{display:flex;gap:8px;justify-content:center;margin-block:16px 8px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--sunken);border:2px solid var(--line)}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.row2{display:flex;gap:10px}
.row2>*{flex:1}

/* options / tiles */
.qprompt{text-align:center;margin-block:8px 18px}
.qprompt .lbl{color:var(--muted);font-weight:800;font-size:15px;margin-bottom:8px}
.qprompt .big{font-family:var(--en);font-size:clamp(28px,8vw,40px);font-weight:800;direction:ltr}
.qprompt .arbig{font-size:30px;font-weight:900}
.speaker{width:96px;height:96px;border-radius:28px;background:var(--lv);color:#fff;display:inline-grid;place-items:center;box-shadow:0 6px 0 var(--lv-deep)}
.speaker svg{width:44px;height:44px}
.speaker.sm{width:60px;height:60px;border-radius:18px}
.speaker.sm svg{width:28px;height:28px}
.speaker:active{transform:translateY(4px);box-shadow:0 2px 0 var(--lv-deep)}
.opts{display:grid;gap:10px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;font-size:18px;font-weight:800;box-shadow:0 4px 0 var(--line);text-align:center;min-height:58px}
.opt.en{font-family:var(--en);font-weight:600}
.opt.sel{border-color:var(--lv);background:var(--lv-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 4px 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 4px 0 var(--bad)}
.opt:disabled{cursor:default}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 8px;font-size:16px;font-weight:800;box-shadow:0 4px 0 var(--line);min-height:56px;transition:opacity .3s,transform .15s}
.tile.en{font-family:var(--en);font-weight:600}
.tile.sel{border-color:var(--lv);background:var(--lv-soft);transform:translateY(-2px)}
.tile.gone{opacity:0;pointer-events:none}
.tile.shake{animation:shake .35s;border-color:var(--bad);background:var(--bad-soft)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.stat{display:flex;justify-content:center;gap:10px;margin-bottom:14px}
.stat span{font-family:var(--en);font-weight:800;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px 10px;font-size:14px}
.answer{min-height:70px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:10px 0;direction:ltr;justify-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px;direction:ltr}
.wtile{font-family:var(--en);font-weight:600;font-size:17px;padding:9px 13px;border-radius:12px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.wtile.used{visibility:hidden}
.inp{width:100%;font-family:var(--en);font-size:24px;font-weight:600;text-align:center;direction:ltr;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.inp:focus{border-color:var(--lv);outline:none}
.blanks{font-family:var(--en);letter-spacing:.3em;color:var(--muted);text-align:center;font-size:20px;margin-top:10px;direction:ltr}

/* feedback bar */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:60;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-top:16px;transform:translateY(110%);transition:transform .25s}
.fb.show{transform:none}
.fb.ok{background:var(--ok-soft);border-top:2px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border-top:2px solid var(--bad)}
.fb .wrap{padding-bottom:0;display:grid;gap:10px}
.fb h4{margin:0;font-size:20px;font-weight:900}
.fb.ok h4{color:var(--ok)}.fb.bad h4{color:var(--bad)}
.fb .corr{font-size:16px}
.foot{position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-top:22px}

/* story */
.lines{display:grid;gap:10px}
.line{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;text-align:start;width:100%}
.line .t{flex:1;min-width:0}
.line .e{font-family:var(--en);font-size:17px;direction:ltr;text-align:left;display:block;line-height:1.5}
.line .a{display:block;color:var(--muted);font-size:15px;margin-top:4px}
.line.on{border-color:var(--lv);background:var(--lv-soft)}
.line .e.blur{filter:blur(6px);user-select:none}
.toggles{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tg{padding:7px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:14px}
.tg[aria-pressed="true"]{border-color:var(--lv);background:var(--lv-soft);color:var(--lv-deep)}
:root[data-theme="dark"] .tg[aria-pressed="true"]{color:var(--lv)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tg[aria-pressed="true"]{color:var(--lv)}}
.steps{counter-reset:s;display:grid;gap:6px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;font-size:15px}
.steps li::before{content:counter(s);font-family:var(--en);font-weight:800;font-size:13px;width:24px;height:24px;border-radius:8px;background:var(--lv-soft);color:var(--lv-deep);display:grid;place-items:center;flex:none;margin-top:1px}
:root[data-theme="dark"] .steps li::before{color:var(--lv)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .steps li::before{color:var(--lv)}}

/* results */
.result{text-align:center;display:grid;gap:14px;justify-items:center;padding-top:30px}
.result .medal{width:120px;height:120px;border-radius:50%;background:var(--gold);display:grid;place-items:center;color:#3B2A00;box-shadow:0 8px 0 var(--gold-deep);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.result .medal svg{width:60px;height:60px}
.result h2{font-size:28px;font-weight:900}
.result .kpis{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.kpi{border:2px solid var(--line);border-radius:16px;padding:10px 16px;background:var(--surface);min-width:96px}
.kpi b{display:block;font-family:var(--en);font-size:24px;font-weight:800}
.kpi small{color:var(--muted);font-size:13px}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
.bigstars{display:flex;gap:6px;color:var(--gold)}
.bigstars svg{width:38px;height:38px}
.bigstars svg.off{color:var(--sunken)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}

/* plan page */
.plan h2{font-size:24px;font-weight:900}
.lvcard{border-radius:var(--r);background:var(--surface);border:1px solid var(--line);overflow:hidden}
.lvcard .hd{background:var(--lv);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.lvcard .hd b{font-size:18px;font-weight:900}
.lvcard .bd{padding:14px 16px;display:grid;gap:8px;font-size:15px}
.lvcard ul{margin:0;padding-inline-start:18px}
.routine{display:grid;gap:8px}
.rt{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.rt .m{font-family:var(--en);font-weight:800;color:var(--lv-deep);min-width:52px;text-align:center;background:var(--lv-soft);border-radius:10px;padding:4px 0;font-size:14px}
:root[data-theme="dark"] .rt .m{color:var(--lv)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rt .m{color:var(--lv)}}
.set{display:grid;gap:14px}
.setrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.setrow b{display:block;font-weight:800;margin-bottom:8px}
.setrow p{color:var(--muted);font-size:14px;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:800;z-index:95;max-width:calc(100% - 32px);text-align:center}
.warnvoice{margin-top:10px;font-size:13px;color:var(--bad)}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100dvh;overscroll-behavior-y:none}
button,a,.tile,.opt,.node,.wtile{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea{font-size:16px}
.sheet{height:100dvh;overscroll-behavior:contain}
.chip{white-space:nowrap;flex:none}
.chip.login{color:var(--lv);font-family:var(--ar);font-size:14px;gap:4px;padding:6px 11px}
.avatar{font-weight:900;font-family:var(--en);color:#fff;background:var(--lv);border-color:var(--lv)}
.savebar{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;padding:12px 14px;border-radius:var(--r);background:var(--lv-soft);border:2px solid color-mix(in srgb,var(--lv) 35%,transparent);text-align:start}
.savebar .ic{width:40px;height:40px;border-radius:12px;background:var(--lv);color:#fff;display:grid;place-items:center;flex:none}
.savebar b{display:block;font-weight:800;font-size:15px}
.savebar small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4}
.savebar>svg:last-child{transform:scaleX(-1);color:var(--muted);flex:none}
.loginpage{display:grid;gap:14px;max-width:420px;margin:0 auto}
.lhero{text-align:center;display:grid;gap:8px;justify-items:center;margin-bottom:6px}
.lhero h2{font-size:24px;font-weight:900}
.lhero p{color:var(--muted)}
.mark.big{width:64px;height:64px;border-radius:20px;background:var(--lv);color:#fff;display:grid;place-items:center}
.mark.big svg{width:34px;height:34px}
.gbtn{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.gbtn svg{width:22px;height:22px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
#lf{display:grid;gap:8px}
#lf label{font-weight:700;font-size:14px;margin-top:4px}
.fld{width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px}
.fld:focus{border-color:var(--lv);outline:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.seg .tg{padding:10px}
.err{color:var(--bad);font-size:14px;min-height:1.2em;margin:2px 0}
.hintx{color:var(--muted);font-size:13px}
.linkb{color:var(--lv);font-weight:700;font-size:14px;padding:8px;text-decoration:underline;text-underline-offset:3px}
@media (max-width:420px){
  body{font-size:15.5px}
  .top .wrap{gap:7px}
  .brand{font-size:18px}.brand .mark{width:30px;height:30px}
  .chip{padding:4px 8px;font-size:14px}
  .iconbtn{width:36px;height:36px}
  .hero{padding:16px;border-radius:20px}
  .hero h2{font-size:20px}
  .hero .num{font-size:38px;min-width:58px}
  .quick{grid-template-columns:1fr}
  .wrow{grid-template-columns:38px minmax(0,1.1fr) minmax(0,1fr);gap:8px;padding:9px 10px}
  .wrow .w{font-size:16px}
  .fc{height:min(300px,42dvh)}
  .face .arb{font-size:30px}
  .match{gap:8px}.match .col{gap:8px}
  .tile{font-size:15px;padding:10px 6px;min-height:52px}
  .opt{font-size:17px;padding:12px;min-height:54px}
  .speaker{width:84px;height:84px;border-radius:24px}
  .qprompt{margin-block:4px 14px}
  .wtile{font-size:16px;padding:8px 11px}
  .nodeRow{height:80px}
  .node{width:64px;height:60px;font-size:20px}
  .result{padding-top:16px}
  .result .medal{width:100px;height:100px}
}
@media (max-width:350px){.levels small{display:none}.node{width:58px;height:56px}}
@media (display-mode: standalone){.top{padding-top:env(safe-area-inset-top,0px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (min-width:600px){.opts.two{grid-template-columns:1fr 1fr}}

e.","بعد كذا اعبر الجسر.",""],["Finally, it's on your right.","أخيراً، هو على يمينك.",""]]},"task":"اشرح لشخص (أو لنفسك) طريق من بيتك لأقرب سوبرماركت بـ First, Then, Finally."},{"n":9,"type":"learn","ar":"التسوق والإرجاع","en":"Returning Things","words":[["size","مقاس","سايز"],["fit","يناسب (المقاس)","فِت"],["try on","يجرّب (لبس)","تراي أون"],["fitting room","غرفة القياس","فِتِنق روم"],["refund","استرجاع المبلغ","ريفَند"],["exchange","يستبدل","إكستشينج"],["receipt","إيصال / فاتورة","رِسيت"],["discount","خصم","دِسكاونت"],["on sale","عليه تخفيض","أون سيل"],["broken","مكسور / خربان","بروكِن"],["loose","واسع","لوس"],["tight","ضيّق","تايت"]],"sents":[["Can I try it on?","أقدر أجربه؟"],["It doesn't fit. It's too tight.","ما يناسبني. ضيق مرة."],["I'd like a refund, please.","أبغى أسترجع المبلغ لو سمحت."],["Do you have the receipt?","عندك الفاتورة؟"]],"story":[["A: Hi. I bought this shirt yesterday, but it doesn't fit.","أ: هلا. اشتريت هالقميص أمس، بس ما يناسبني."],["B: What's the problem?","ب: وش المشكلة؟"],["A: It's too tight. Can I exchange it for a bigger size?","أ: ضيق مرة. أقدر أبدله بمقاس أكبر؟"],["B: Sure. Do you have the receipt?","ب: أكيد. عندك الفاتورة؟"],["A: Yes, here it is.","أ: إيه، تفضل."],["B: Here's a large. You can try it on in the fitting room.","ب: هذا لارج. تقدر تجربه في غرفة القياس."]],"rule":{"t":"too و enough","x":"too + صفة = «زيادة عن اللزوم» (too big). صفة + enough = «كافي» (big enough). not + صفة + enough = «مو كافي».","ex":[["It's too small.","صغير مرة (زيادة).",""],["It isn't big enough.","مو كبير كفاية.",""],["I don't have enough money.","ما عندي فلوس كافية.",""],["It's too expensive.","غالي مرة.",""]]},"task":"اكتب حوار قصير ترجّع فيه شي خربان وتطلب refund."},{"n":10,"type":"learn","ar":"مقابلة عمل","en":"Job Interview","words":[["position","منصب / وظيفة","بُزِشَن"],["apply for","يتقدم لـ","أبلاي فور"],["CV","سيرة ذاتية","سي في"],["skills","مهارات","سكِلز"],["strength","نقطة قوة","سترَنقث"],["weakness","نقطة ضعف","ويكنِس"],["responsible for"  I. But I don't like the rain.","أ: وأنا بعد. بس ما أحب المطر."],["B: Really? I disagree. Rain is beautiful!","ب: جد؟ ما أتفق. المطر حلو!"],["A: Good point, it's beautiful. However, the traffic is terrible.","أ: نقطة حلوة، حلو. ومع ذلك الزحمة فظيعة."],["B: Ha ha, you're right about that.","ب: ههه، معك حق في هذي."]],"rule":{"t":"So do I و Neither do I","x":"للموافقة على جملة مثبتة: So do I / So am I (وأنا بعد). وعلى جملة منفية: Neither do I / Neither am I (ولا أنا).","ex":[["I like tea. - So do I.","أحب الشاي. - وأنا بعد.",""],["I'm tired. - So am I.","أنا تعبان. - وأنا بعد.",""],["I don't smoke. - Neither do I.","ما أدخن. - ولا أنا.",""],["I can't swim. - Neither can I.","ما أعرف أسبح. - ولا أنا.",""]]},"task":"اكتب ٥ جمل عن نفسك، وتحت كل وحدة رد موافقة أو اعتراض (So do I / Neither do I / I disagree)."},{"n":13,"type":"learn","ar":"الخطط والدعوات","en":"Making Plans","words":[["are you free","أنت فاضي؟","آر يو فري"],["let's","خلنا","لَتس"],["how about","وش رأيك في","هاو أباوت"],["sounds good","فكرة حلوة","ساوندز قُد"],["invitation","دعوة / عزيمة","إنفِتيشَن"],["join","ينضم","جوين"],["pick up","يمر ياخذ (أحد)","بِك أب"],["on time","في الموعد","أون تايم"],["cancel","يلغي","كانسِل"],["postpone","يأجّل","بوستبون"],["another time","وقت ثاني","أنَذَر تايم"],["looking forward to","متحمس لـ / أنتظر","لُكِنق فورورد تو"]],"sents":[["Are you free on Thursday?","فاضي يوم الخميس؟"],["How about dinner at my place?","وش رأيك بعشا عندي؟"],["Sounds good!","فكرة حلوة!"],["Sorry, I'm working that day. Maybe another time.","آسف، عندي دوام ذاك اليوم. خليها وقت ثاني."]],"story":[["A: Hey! What are you doing this weekend?","أ: هلا! وش مسوي هالويكند؟"],["B: Nothing special. Why?","ب: ولا شي. ليش؟"],["A: We're having a barbecue on Friday. Would you like to join us?","أ: عندنا شوي الجمعة. تحب تنضم لنا؟"],["B: Sounds good! What time?","ب: فكرة حلوة! متى؟"],["A: At seven. I can pick you up.","أ: سبع. أقدر أمرك."],["B: Great, thanks! I'm looking forward to it.","ب: ممتاز، شكراً! متحمس لها."]],"rule":{"t":"المضارع المستمر للمستقبل","x":"نستخدم am/is/are + ing للمواعيد والخطط المرتبة مع وقت محدد.","ex":[["I'm meeting Ali tomorrow.","بقابل علي بكرة.",""],["What are you doing this weekend?","وش مسوي هالويكند؟",""],["We're flying on Monday.","بنطير الاثنين.",""],["She's coming at eight.","بتجي الساعة ثمان.",""]]},"task":"اكتب رسالة واتساب بالإنجليزي تعزم فيها صديق، ورسالة ثانية تعتذر فيها بأدب."},{"n":14,"type":"review"},{"n":15,"type":"learn","ar":"الشكوى","en":"Making a Complaint","words":[["complain","يشتكي","كَمبلين"],["complaint","شكوى","كَمبلينت"],["problem","مشكلة","بروبلَم"],["not working","ما يشتغل","نوت ويركِنق"],["disappointed","خاب ظنه / زعلان","دِسأبوينتِد"],["unacceptable","غير مقبول","أنأكسَبتَبِل"],["customer service","خدمة العملاء","كَستَمَر سيرفِس"],["apologize","يعتذر","أبولَجايز"],["solve","يحل","سولف"],["as soon as possible","بأسرع وقت ممكن","آز سون آز بوسِبِل"],["compensation","تعويض","كومبَنسيشَن"],["mistake","خطأ","مِستيك"]],"sents":[["I'd like to make a complaint.","أبغى أقدم شكوى."],["The internet is not working.","النت ما يشتغل."],["Please solve it as soon as possible.","لو سمحت حلها بأسرع وقت."],["If you don't fix it, I will cancel.","إذا ما صلحتوها، بلغي."]],"story":[["A: Hello, I'd like to make a complaint.","أ: ألو، أبغى أقدم شكوى."],["B: I'm sorry to hear that. What's the problem?","ب: آسفين نسمع كذا. وش المشكلة؟"],["A: My internet has not been working for two days.","أ: النت عندي ما يشتغل من يومين."],["A: This is unacceptable. I work from home.","أ: هذا غير مقبول. أنا أشتغل من البيت."],["B: We apologize. A technician will visit you today.","ب: نعتذر. فني بيزورك اليوم."],["A: If it isn't fixed today, I will cancel my contract.","أ: إذا ما انصلح اليوم، بلغي العقد."]],"rule":{"t":"الشرط الأول: If + مضارع، will","x":"لشي ممكن يصير في المستقبل ونتيجته: If + مضارع بسيط، will + فعل.","ex":[["If it rains, I will stay home.","إذا مطرت، بجلس في البيت.",""],["If you don't fix it, I will call the manager.","إذا ما صلحته، بكلم المدير.",""],["If I have time, I'll visit you.","إذا عندي وقت، بزورك.",""],["What will you do if he's late?","وش بتسوي إذا تأخر؟",""]]},"task":"اكتب شكوى قصيرة (٤ جمل) عن خدمة سيئة واجهتها، مع جملة If."},{"n":16,"type":"learn","ar":"طلب المساعدة","en":"Asking for Help","words":[["could you","ممكن (أنت)","كُد يو"],["would you mind","تمانع","وُد يو مايند"],["do me a favor","تسوي لي معروف","دو مي أ فيفَر"],["slowly","ببطء","سلولي"],["repeat","يعيد","رِبيت"],["spell","يتهجى","سبَل"],["explain","يشرح","إكسبلين"],["mean","يقصد / يعني","مين"],["of course","أكيد","أوف كورس"],["no problem","ولا يهمك","نو بروبلَم"],["appreciate","يقدّر","أبريشييت"],["kind","لطيف / كريم","كايند"]],"sents":[["Could you speak more slowly, please?","ممكن تتكلم أبطأ لو سمحت؟"],["Could you repeat that?","ممكن تعيد؟"],["What does this word mean?","وش معنى هالكلمة؟"],["That's very kind of you. I appreciate it.","هذا لطف منك. أقدرها."]],"story":[["A: Excuse me, could you do me a favor?","أ: لو سمحت، ممكن تسوي لي معروف؟"],["B: Of course. What is it?","ب: أكيد. وش هو؟"],["A: My English isn't very good. Could you explain this form?","أ: إنجليزيي مو مرة زين. ممكن تشرح لي هالنموذج؟"],["B: No problem. Write your name here and sign here.","ب: ولا يهمك. اكتب اسمك هنا ووقع هنا."],["A: Sorry, could you repeat that more slowly?","أ: آسف، ممكن تعيدها أبطأ؟"],["B: Sure. Name here... signature here.","ب: أكيد. الاسم هنا... التوقيع هنا."],["A: Thank you, that's very kind of you.","أ: شكراً، هذا لطف منك."]],"rule":{"t":"الطلب المهذب: Could you / Would you mind","x":"Could you + فعل؟ طلب مهذب. Would you mind + فعل ing؟ أكثر أدباً، وتعني «تمانع...؟».","ex":[["Could you help me, please?","ممكن تساعدني لو سمحت؟",""],["Could you speak more slowly?","ممكن تتكلم أبطأ؟",""],["Would you mind opening the window?","تمانع تفتح الشباك؟",""],["Do you know where the bank is?","تعرف وين البنك؟",""]]},"task":"احفظ ٣ جمل للطوارئ: Could you speak more slowly? / Could you repeat that? / What does ... mean?"},{"n":17,"type":"learn","ar":"السوالف الخفيفة","en":"Small Talk","words":[["how's it going","كيف الأمور","هاوز إت قوينق"],["not bad","مو شين","نوت باد"],["what's new","وش الجديد","ووتس نيو"],["by the way","على فكرة","باي ذا وي"],["actually","في الحقيقة","آكتشوَلي"],["really","جد؟ / حقاً","ريلي"],["lovely","جميل / لطيف","لَفلي"],["lately","مؤخراً","ليتلي"],["same here","وأنا نفس الشي","سيم هير"],["anyway","على العموم","إنيوي"],["take care","انتبه لنفسك","تيك كير"],["see you around","أشوفك","سي يو أراوند"]],"sents":[["How's it going? - Not bad, thanks.","كيف الأمور؟ - تمام، شكراً."],["Lovely weather today, isn't it?","الجو حلو اليوم، صح؟"],["By the way, how's your family?","على فكرة، كيف أهلك؟"],["Anyway, I have to go. Take care!","على العموم، لازم أمشي. انتبه لنفسك!"]],"story":[["A: Hey Mike! How's it going?","أ: هلا مايك! كيف الأمور؟"],["B: Not bad, thanks. What's new with you?","ب: تمام، شكراً. وش الجديد عندك؟"],["A: Actually, I've been really busy lately.","أ: في الحقيقة، كنت مشغول مرة مؤخراً."],["B: Same here. Nice weather today, isn't it?","ب: وأنا نفس الشي. الجو حلو اليوم، صح؟"],["A: Yes, lovely! By the way, how's your new job?","أ: إيه، حلو! على فكرة، كيف شغلك الجديد؟"],["B: It's great. Anyway, I have to go. Take care!","ب: رهيب. على العموم، لازم أمشي. انتبه لنفسك!"]],"rule":{"t":"أسئلة التأكيد (Question Tags)","x":"نضيف سؤال صغير في آخر الجملة للتأكيد وفتح الكلام: إذا الجملة مثبتة نستخدم نفي (isn't it?)، وإذا منفية نستخدم إثبات (is it?).","ex":[["It's hot today, isn't it?","الجو حار اليوم، صح؟",""],["You're from Riyadh, aren't you?","أنت من الرياض، صح؟",""],["He doesn't smoke, does he?","هو ما يدخن، صح؟",""],["You like coffee, don't you?","تحب القهوة، صح؟",""]]},"task":"استخدم ٣ عبارات من اليوم مع شخص حقيقي، أو قلها لنفسك في المراية."},{"n":18,"type":"learn","ar":"الأخبار والأحداث","en":"In the News","words":[["news","أخبار","نيوز"],["according to","حسب / وفقاً لـ","أكوردِنق تو"],["announce","يعلن","أناونس"],["government","حكومة","قافَرنمَنت"],["accident","حادث","آكسِدَنت"],["injured","مصاب","إنجَرد"],["built","مبني (بُني)","بِلت"],["opened","افتُتح","أوبِند"],["increase","يزيد / زيادة","إنكريس"],["decrease","ينقص / انخفاض","دِكريس"],["percent","بالمئة","بيرسَنت"],["recently","مؤخراً / حديثاً","ريسَنتلي"]],"sents":[["Did you hear the news?","سمعت الخبر؟"],["A new metro was opened in Riyadh.","انفتح مترو جديد في الرياض."],["Prices increased by ten percent.","الأسعار زادت عشرة بالمية."],["Two people were injured in the accident.","انصاب شخصين في الحادث."]],"story":[["Here is today's news.","هذي أخبار اليوم."],["A new hospital was opened in Jeddah yesterday.","انفتح مستشفى جديد في جدة أمس."],["It was built in two years.","انبنى في سنتين."],["According to the government, it has five hundred beds.","حسب الحكومة، فيه خمس مية سرير."],["In other news, a road was closed after a small accident. No one was injured.","وفي خبر ثاني، انسكر طريق بعد حادث بسيط. ما انصاب أحد."]],"rule":{"t":"المبني للمجهول (Passive)","x":"لما يكون الفعل أهم من الفاعل: is/are + التصريف الثالث (مضارع)، و was/were + التصريف الثالث (ماضي).","ex":[["The mosque was built in 1950.","المسجد انبنى في ١٩٥٠.",""],["English is spoken everywhere.","الإنجليزي ينتكلم في كل مكان.",""],["The road was closed.","الطريق انسكر.",""],["Three people were injured.","انصاب ثلاث أشخاص.",""]]},"task":"اقرأ عنوان خبر واحد بالإنجليزي اليوم (من أي موقع أخبار) وحاول تفهمه."},{"n":19,"type":"learn","ar":"الإيميل الرسمي","en":"Writing Emails","words":[["dear","عزيزي","دير"],["regarding","بخصوص","رِقاردِنق"],["attached","مرفق","أتاتشت"],["request","طلب / يطلب","رِكوَست"],["confirm","يؤكد","كَنفيرم"],["inform","يبلّغ","إنفورم"],["kindly","يرجى / تكرماً","كايندلي"],["as soon as","حالما / أول ما","آز سون آز"],["further","إضافي / أكثر","فيرذَر"],["sincerely","بإخلاص (ختام رسمي)","سِنسيرلي"],["best regards","أطيب التحيات","بَست رِقاردز"],["reply","يرد / رد","رِبلاي"]],"sents":[["Dear Ms. Sarah,","عزيزتي الأستاذة سارة،"],["I am writing regarding my application.","أكتب بخصوص طلبي."],["Please find attached my CV.","تجدون مرفق سيرتي الذاتية."],["I look forward to your reply.","أتطلع لردكم."]],"story":[["Dear Mr. Ali,","عزيزي الأستاذ علي،"],["I am writing regarding the meeting next Monday.","أكتب بخصوص اجتماع الاثنين القادم."],["Could you kindly confirm the time?","ممكن تتكرم وتؤكد الوقت؟"],["Please find attached the report.","تجد مرفق التقرير."],["If you need further information, please let me know.","إذا تحتاج معلومات إضافية، بلغني."],["Best regards, Fahad","مع أطيب التحيات، فهد"]],"rule":{"t":"لغة الإيميل الرسمي","x":"افتتح بـ Dear + الاسم، واطلب بـ I would like to / Could you please، واختم بـ Best regards.","ex":[["Dear Mr. Ahmed,","عزيزي الأستاذ أحمد،",""],["I am writing to ask about...","أكتب لأسأل عن...",""],["Please find attached...","تجد مرفق...",""],["Best regards,","مع أطيب التحيات،",""]]},"task":"اكتب إيميل من ٤ أسطر لمديرك تطلب فيه إجازة يوم."},{"n":20,"type":"learn","ar":"مشاكل السفر","en":"Travel Problems","words":[["missed","فاتته (الرحلة)","مِست"],["cancelled","ملغي","كانسِلد"],["connection","رحلة ترانزيت / اتصال","كَنَكشَن"],["lost luggage","عفش ضايع","لوست لَقِج"],["overweight","وزن زائد","أوفَرويت"],["extra","إضافي","إكسترا"],["embassy","سفارة","إمبَسي"],["stolen","مسروق","ستولَن"],["report","يبلغ عن","رِبورت"],["insurance","تأمين","إنشورَنس"],["rent a car","يستأجر سيارة","رَنت أ كار"],["on the way","في الطريق","أون ذا وي"]],"sents":[["I missed my flight.","فاتتني الرحلة."],["My luggage didn't arrive.","عفشي ما وصل."],["My wallet was stolen. I'd like to report it.","انسرقت محفظتي. أبغى أبلغ عنها."],["We had to pay extra for overweight bags.","اضطرينا ندفع زيادة للوزن الزائد."]],"story":[["Last summer our trip started badly.","الصيف الماضي رحلتنا بدأت بشكل سيء."],["Our first flight was delayed, so we missed our connection.","رحلتنا الأولى تأخرت، فاتتنا رحلة الترانزيت."],["We had to wait six hours at the airport.","اضطرينا ننتظر ست ساعات في المطار."],["When we arrived, my suitcase didn't arrive with us!","لما وصلنا، شنطتي ما وصلت معنا!"],["I had to report the lost luggage and we couldn't sleep until two a.m.","اضطريت أبلغ عن العفش الضايع وما قدرنا ننام إلا الساعة ثنتين."],["But the rest of the trip was amazing.","بس باقي الرحلة كانت رهيبة."]],"rule":{"t":"had to و couldn't","x":"had to = «اضطريت / كان لازم» (ماضي have to). couldn't = «ما قدرت» (ماضي can't).","ex":[["I had to wait for three hours.","اضطريت أنتظر ثلاث ساعات.",""],["We couldn't find a taxi.","ما قدرنا نلقى تاكسي.",""],["She had to pay extra.","اضطرت تدفع زيادة.",""],["Did you have to change planes?","اضطريت تغير الطيارة؟",""]]},"task":"احكِ قصة موقف صعب صار لك في سفر (أو تخيله) في ٥ جمل باستخدام had to و couldn't."},{"n":21,"type":"review"},{"n":22,"type":"learn","ar":"حكاية القصص","en":"Telling a Story","words":[["one day","في يوم من الأيام","وَن دي"],["suddenly","فجأة","سَدِنلي"],["at first","في البداية","آت فيرست"],["in the end","في النهاية","إن ذي إند"],["meanwhile","في هذي الأثناء","مينوايل"],["luckily","لحسن الحظ","لَكِلي"],["unfortunately","للأسف","أنفورتشَنَتلي"],["scared","خايف","سكيرد"],["surprised","متفاجئ","سَربرايزد"],["noticed","لاحظ","نوتِست"],["realized","أدرك / انتبه","ريَلايزد"],["happened","حدث","هابَند"]],"sents":[["Suddenly, the lights went out.","فجأة طفت الأنوار."],["Luckily, nobody was hurt.","لحسن الحظ، ما تضرر أحد."],["At first I was scared, but then I laughed.","في البداية خفت، بس بعدين ضحكت."],["I realized I forgot my wallet.","انتبهت إني نسيت محفظتي."]],"story":[["One day, I was driving to work.","في يوم كنت أسوق للدوام."],["Suddenly, I noticed a small cat in the middle of the road.","فجأة لاحظت قطوة صغيرة في نص الطريق."],["I stopped the car. At first the cat was scared.","وقفت السيارة. في البداية القطوة كانت خايفة."],["I gave it some water and it came to me.","عطيتها شوية ماء وجت لي."],["Unfortunately, I was late for work.","للأسف تأخرت على الدوام."],["But in the end, I took the cat home. Now she's part of the family!","بس في النهاية أخذت القطوة للبيت. الحين هي من العائلة!"]],"rule":{"t":"كلمات ربط القصة","x":"لسرد قصة: One day (في يوم)، Suddenly ( const pick=(a,n)=>shuffle(a).slice(0,n);

const W={}, LV={};
DATA.forEach(L=>{LV[L.id]=L;L.days.forEach(d=>{if(d.type!=='learn')return;d.wl=d.words.map((w,i)=>{const o={id:`${L.id}-${d.n}-${i}`,en:w[0],ar:w[1],pr:w[2],lv:L.id,day:d.n};W[o.id]=o;return o})})});
const ALLW=Object.values(W);
function wordsFor(lv,n){const L=LV[lv];const d=L.days[n-1];
  if(d.type==='learn')return d.wl;
  if(d.type==='review'){return L.days.slice(Math.max(0,n-7),n-1).filter(x=>x.type==='learn').flatMap(x=>x.wl)}
  return L.days.filter(x=>x.type==='learn').flatMap(x=>x.wl)}
function prevWords(lv,n,k){const L=LV[lv];const pool=L.days.slice(0,n-1).filter(x=>x.type==='learn').flatMap(x=>x.wl);
  const li=DATA.findIndex(x=>x.id===lv);const earlier=DATA.slice(0,li).flatMap(x=>x.days.filter(d=>d.type==='learn').flatMap(d=>d.wl));
  return pick(pool.length>=k?pool:pool.concat(earlier),k)}

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const yesterday=()=>{const d=new Date(Date.now()-864e5);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fresh=()=>({v:1,xp:0,streak:0,best:0,last:'',daily:{},lv:{l1:{},l2:{},l3:{}},hard:{},cur:'l1',set:{tr:'auto',rate:'n',accent:'us',unlock:false}});
let S=fresh();
function merge(o){const f=fresh();return Object.assign(f,o||{},{lv:Object.assign(f.lv,(o||{}).lv||{}),set:Object.assign(f.set,(o||{}).set||{})})}
const Auth={on:false,user:null,fb:null,db:null,
  async init(){const cfg=window.DARB_FIREBASE;if(!cfg||!cfg.apiKey)return;
    try{await loadScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js');
      await Promise.all([loadScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js'),loadScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js')]);
      firebase.initializeApp(cfg);this.fb=firebase.auth();this.db=firebase.firestore();this.on=true;
      try{await this.fb.setPersistence(firebase.auth.Auth.Persistence.LOCAL)}catch(e){}
      try{await this.fb.getRedirectResult()}catch(e){if(e&&e.code)toast(authErr(e))}
      this.fb.onAuthStateChanged(u=>Store.onUser(u));render();
    }catch(e){console.warn('auth off',e);this.on=false}},
  google(){const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
    return this.fb.signInWithPopup(p).catch(e=>{if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code))return this.fb.signInWithRedirect(p);throw e})},
  email(e,p,create){return create?this.fb.createUserWithEmailAndPassword(e,p):this.fb.signInWithEmailAndPassword(e,p)},
  reset(e){return this.fb.sendPasswordResetEmail(e)},
  out(){return this.fb.signOut()}};
function loadScript(src){return new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=src;sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)})}
function authErr(e){const m={'auth/invalid-email':'الإيميل مكتوب غلط.','auth/missing-password':'اكتب كلمة المرور.','auth/wrong-password':'كلمة المرور غلط.','auth/invalid-credential':'الإيميل أو كلمة المرور غلط.','auth/invalid-login-credentials':'الإيميل أو كلمة المرور غلط.','auth/user-not-found':'ما فيه حساب بهذا الإيميل. اضغط «حساب جديد».','auth/email-already-in-use':'هذا الإيميل مسجّل من قبل. سجّل دخول بدل حساب جديد.','auth/weak-password':'كلمة المرور لازم تكون ٦ أحرف أو أكثر.','auth/too-many-requests':'محاولات كثيرة. انتظر شوي وجرب مرة ثانية.','auth/network-request-failed':'تأكد من اتصالك بالإنترنت.','auth/popup-closed-by-user':'انقفلت نافذة الدخول قبل ما تكمل.','auth/unauthorized-domain':'هذا الرابط غير مفعّل لتسجيل الدخول بعد.'};return m[e&&e.code]||'صار خطأ، جرب مرة ثانية.'}
const Store={base:'darb-en-v1',uid:null,ref:null,busy:false,again:false,t:0,synced:false,
  key(){return this.base+':'+(this.uid||'guest')},
  readLocal(k){try{const l=JSON.parse(localStorage.getItem(k)||'null');return l?merge(l):null}catch(e){return null}},
  async init(){S=this.readLocal(this.key())||this.readLocal(this.base)||fresh();render();Auth.init()},
  async onUser(u){Auth.user=u;
    if(!u){this.uid=null;this.ref=null;this.synced=false;S=this.readLocal(this.key())||fresh();render();return}
    this.uid=u.uid;this.ref=Auth.db.collection('users').doc(u.uid);
    const guest=this.readLocal(this.base+':guest')||this.readLocal(this.base);const mine=this.readLocal(this.key());
    let best=mine||fresh();
    try{const snap=await this.ref.get();if(snap.exists){const r=merge(snap.data().p||snap.data());if((r.xp||0)>=(best.xp||0))best=r}}catch(e){console.warn(e)}
    if(guest&&(guest.xp||0)>(best.xp||0)){best=guest;try{localStorage.removeItem(this.base+':guest');localStorage.removeItem(this.base)}catch(e){}}
    S=best;this.synced=true;this.save(true);render();
    if(view.name==='login')go({name:'home'});toast('أهلاً '+(u.displayName||u.email||'')+'، تقدمك محفوظ على حسابك');},
  save(now){try{localStorage.setItem(this.key(),JSON.stringify(S))}catch(e){}clearTimeout(this.t);this.t=setTimeout(()=>this.flush(),now?10:1200)},
  async flush(){if(!this.ref)return;if(this.busy){this.again=true;return}this.busy=true;
    try{await this.ref.set({p:JSON.parse(JSON.stringify(S)),updated:Date.now(),name:(Auth.user&&(Auth.user.displayName||Auth.user.email))||''})}catch(e){console.warn('save failed',e)}
    this.busy=false;if(this.again){this.again=false;this.flush()}}
};
window.addEventListener('pagehide',()=>{if(Store.ref)Store.flush()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&Store.ref)Store.flush()});
const dayRec=(lv,n)=>{const L=S.lv[lv]||(S.lv[lv]={});return L['d'+n]||(L['d'+n]={m:{},stars:0,best:0})};
function addXP(n){
  const t=today();
  if(S.last!==t){S.streak=(S.last===yesterday())?S.streak+1:1;S.last=t;S.best=Math.max(S.best||0,S.streak)}
  S.xp+=n;S.daily[t]=(S.daily[t]||0)+n;
  const keys=Object.keys(S.daily).sort();if(keys.length>60)keys.slice(0,keys.length-60).forEach(k=>delete S.daily[k]);
  Store.save();
}
function addHard(w){if(!w)return;S.hard[w.id]=Math.min(5,(S.hard[w.id]||0)+1)}
function easeHard(w){if(!w||!S.hard[w.id])return;S.hard[w.id]--;if(S.hard[w.id]<=0)delete S.hard[w.id]}
const GOAL=60;

/* unlocks */
function levelOpen(lv){if(S.set.unlock||lv==='l1')return true;const prev=lv==='l2'?'l1':'l2';return (dayRec(prev,30).best||0)>=80}
function dayOpen(lv,n){if(!levelOpen(lv))return false;if(S.set.unlock||n===1)return true;return (dayRec(lv,n-1).best||0)>=80}
function dayDone(lv,n){return (dayRec(lv,n).best||0)>=80}
function curDay(lv){for(let n=1;n<=30;n++){if(!dayDone(lv,n))return n}return 30}

/* ---------- speech ---------- */
const NOVELTY=/\b(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Deranged|Hysterical|Pipe Organ|Princess|Ralph|Kathy|Junior|Fred|Grandma|Grandpa|Rocko|Shelley|Sandy|Flo|Eddy|Reed)\b/i;
const MALE=/\b(Evan|Nathan|Tom|Alex|Aaron|Daniel|Oliver|Arthur|Gordon|Lee|Rishi|Male|Guy|Andrew|Christopher|Eric|Roger|Steffan|Brian|Davis|Jason|Tony|Ryan|Thomas|George|Liam|William|Mark|David|James|Joey|Justin|Matthew)\b/i;
const TTS={voices:[],ready:false,
  load(){if(!('speechSynthesis' in window))return;const v=speechSynthesis.getVoices();if(v.length){this.voices=v;this.ready=true;if(view&&view.name==='set')render()}},
  english(){const acc=S.set.accent==='uk'?'en-GB':'en-US';
    let v=this.voices.filter(x=>x.lang&&/^en/i.test(x.lang)&&!NOVELTY.test(x.name));
    const q=x=>(/(Premium|Enhanced|Neural|Natural|Online)/i.test(x.name)?0:10)+(x.lang.replace('_','-').startsWith(acc)?0:5)+(/Google|Microsoft/.test(x.name)?1:2);
    return v.sort((a,b)=>q(a)-q(b))},
  female(){const v=this.english();const pref=['Samantha','Ava','Zoe','Allison','Susan','Google US English','Aria','Jenny','Emma','Sonia','Libby','Karen','Serena','Moira','Tessa','Google UK English Female'];
    const f=v.filter(x=>!MALE.test(x.name));f.sort((a,b)=>{const r=x=>{const i=pref.findIndex(p=>x.name.includes(p));return (i<0?50:i)+(/(Premium|Enhanced|Neural|Natural|Online)/i.test(x.name)?-100:0)};return r(a)-r(b)});return f.length?f:v},
  male(){const v=this.english();const pref=['Evan','Nathan','Tom','Alex','Aaron','Google UK English Male','Andrew','Guy','Christopher','Eric','Ryan','Daniel','Arthur','Oliver','Lee'];
    const m=v.filter(x=>MALE.test(x.name));m.sort((a,b)=>{const r=x=>{const i=pref.findIndex(p=>x.name.includes(p));return (i<0?50:i)+(/(Premium|Enhanced|Neural|Natural|Online)/i.test(x.name)?-100:0)};return r(a)-r(b)});return m},
  byName(n){return n?this.voices.find(x=>x.name===n):null},
  mainVoice(){return this.byName(S.set.vA)||(S.set.vAg==='m'?this.male()[0]:null)||this.female()[0]||this.english()[0]},
  secondVoice(){const a=this.mainVoice();const b=this.byName(S.set.vB)||this.male().find(x=>x!==a)||this.female().find(x=>x!==a)||this.english().find(x=>x!==a);return b||a},
  pickVoices(){return this.english()},
  fix(t){const s=t.trim();if(s==='I')return 'eye';if(s==='a')return 'uh';return t.replace(/\bI\b(?=[.!?,]?$)/,'eye')},
  unlocked:false,warned:false,_u:null,
  unlock(){if(this.unlocked||!('speechSynthesis' in window))return;this.unlocked=true;
    try{this.load();const u=new SpeechSynthesisUtterance(' ');u.volume=0;u.lang='en-US';speechSynthesis.speak(u)}catch(e){}},
  _speak(text,opt,res){
    const u=new SpeechSynthesisUtterance(this.fix(text));this._u=u;
    this.load();const v=opt.voice===1?this.secondVoice():this.mainVoice();
    if(v){u.voice=v;u.lang=v.lang}else u.lang=S.set.accent==='uk'?'en-GB':'en-US';
    const base=S.set.rate==='s'?0.8:0.92;u.rate=opt.slow?0.62:base;u.pitch=1;u.volume=1;
    let done=false,started=false;const fin=()=>{if(!done){done=true;res()}};
    u.onstart=()=>{started=true};u.onend=fin;
    u.onerror=e=>{if(e&&(e.error==='not-allowed'||e.error==='audio-busy')&&!this.warned){this.warned=true;toast('اضغط زر الصوت 🔊 مرة وحدة عشان يشتغل الصوت')}fin()};
    setTimeout(()=>{if(!started&&!done&&!this.warned&&!opt.quiet){this.warned=true;toast('ما طلع صوت؟ تأكد إن الجوال مو على الصامت وإن الصوت مرفوع')}},2500);
    setTimeout(fin,Math.max(4000,text.length*180));
    try{speechSynthesis.resume()}catch(e){}
    speechSynthesis.speak(u)},
  say(text,opt={}){
    if(!('speechSynthesis' in window)){toast('المتصفح ما يدعم النطق الصوتي');return Promise.resolve()}
    this.unlocked=true;
    return new Promise(res=>{
      // إذا فيه كلام شغّال نوقفه وننتظر شوي، لأن بعض المتصفحات تبلع الجملة الجديدة إذا جات مباشرة بعد الإيقاف
      if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(()=>this._speak(text,opt,res),120)}
      else this._speak(text,opt,res)})},
  stop(){try{if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel()}catch(e){}}
};
if('speechSynthesis' in window){TTS.load();speechSynthesis.onvoiceschanged=()=>TTS.load();
  ['pointerdown','touchend','keydown'].forEach(ev=>document.addEventListener(ev,()=>TTS.unlock(),{capture:true,passive:true}))}
const speakText=s=>s.replace(/^(A|B|Doctor|Patient):\s*/,'');
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){e.stopPropagation();TTS.say(b.dataset.say,{slow:b.dataset.slow==='1'})}},true);

function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#17875A','#1D6BB5','#D8612A','#F0AE22','#E4572E'];const ps=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*5,c:cols[Math.random()*5|0],vy:2+Math.random()*3,vx:-1.5+Math.random()*3,a:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(++f<170)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})()}

let view={name:'home'};
function go(v){TTS.stop();view=v;render();const sh=document.querySelector('.sheet');if(sh)sh.scrollTop=0;else if(v.name==='home'&&v.keep!==true)window.scrollTo(0,v.scroll||0)}
function render(){const app=$('#app');document.documentElement.className='lv-'+(view.lv||S.cur);
  app.className='lv-'+(view.lv||S.cur);
  if(view.name==='home')app.innerHTML=homeHTML();
  else if(view.name==='day')app.innerHTML=homeHTML()+`<div class="sheet lv-${view.lv}">${dayHTML(view.lv,view.n)}</div>`;
  else if(view.name==='act'){app.innerHTML=homeHTML()+`<div class="sheet lv-${view.lv}" id="actSheet"></div>`;runAct()}
  else if(view.name==='plan')app.innerHTML=homeHTML()+`<div class="sheet">${planHTML()}</div>`;

/* ---------- home ---------- */

  const pct=Math.min(100,Math.round(dx/GOAL*100));const C=2*Math.PI*19;
  const hardN=Object.keys(S.hard).length;const streak=(S.last===t||S.last===yesterday())?S.streak:0;

      ${cur?`<span class="bubble">ابدأ هنا</span>`:''}
      ${dd.type!=='learn'?`<span class="tag">${dd.type==='review'?'مراجعة':'اختبار'}</span>`:''}
      ${inner}${done?`<span class="stars">${[1,2,3].map(k=>`<svg viewBox="0 0 24 24" style="opacity:${k<=st?1:.25}">${P.star}</svg>`).join('')}</span>`:''}</button></div>`});
  const dTitle=d.type==='learn'?esc(d.ar):d.type==='review'?'يوم مراجعة الأسبوع':'اختبار نهاية المستوى';

    <button class="iconbtn" data-go="set" aria-label="الإعدادات">${ic('gear')}</button></div></header>

    <div class="goal"><svg class="ring" viewBox="0 0 46 46"><circle cx="23" cy="23" r="19" fill="none" stroke="var(--sunken)" stroke-width="6"/><circle cx="23" cy="23" r="19" fill="none" stroke="var(--gold)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}" transform="rotate(-90 23 23)"/></svg>
      <div><b>هدف اليوم: <span class="en">${Math.min(dx,GOAL)}/${GOAL}</span> نقطة</b><p>${dx>=GOAL?'أحسنت! حققت هدف اليوم وحافظت على سلسلتك.':'كل مهمة تعطيك نقاط. خلّص درس اليوم وتوصل للهدف.'}</p></div></div>
    <div class="quick">
      <button class="qbtn" data-go="plan"><span class="ic" style="background:var(--lv-soft);color:var(--lv)">${ic('map')}</span><span><b>الخطة والملفات</b><small>كيف تذاكر + ملفات PDF</small></span></button>
      <button class="qbtn" data-hard="1" ${hardN?'':'disabled style="opacity:.6"'}><span class="ic" style="background:var(--bad-soft);color:var(--bad)">${ic('loop')}</span><span><b>كلماتي الصعبة</b><small>${hardN?`${hardN} كلمة تحتاج مراجعة`:'الكلمات اللي تغلط فيها تجي هنا'}</small></span></button>
    </div>

  </main>`}

/* ---------- day page ---------- */
function dayHTML(lv,n){const L=LV[lv],d=L.days[n-1],rec=dayRec(lv,n),ms=missionsFor(d);
  const title=d.type==='learn'?esc(d.ar):d.type==='review'?'مراجعة الأسبوع '+arNum(n/7):'اختبار '+L.name;
  const words=wordsFor(lv,n);
  let h=`<div class="shead"><div class="wrap"><button class="iconbtn" data-go="home" aria-label="رجوع">${ic('back')}</button><h3>اليوم ${arNum(n)} · ${L.name}</h3></div></div>
  <div class="wrap sbody"><div class="dayhead"><span class="kick en">DAY ${n}${d.type==='learn'?' · '+esc(d.en):''}</span><h2>${title}</h2></div>
  <div class="missions">`;
  ms.forEach((m,i)=>{const done=!!rec.m[m.id];const desc=m.id==='task'?esc(d.task):m.d;
    h+=`<button class="mis ${done?'done':''}" data-act="${m.id}"><span class="step">${i+1}</span><span class="ic">${done?ic('check'):ic(m.ic)}</span><span class="tx"><b>${m.t}</b><small>${desc}</small></span><span class="xpb">+${m.xp}</span></button>`});
  h+=`</div>`;
  if(rec.best)h+=`<p style="margin-top:12px;color:var(--muted);font-size:14px">أفضل نتيجة في الاختبار: <b class="en">${rec.best}%</b></p>`;
  if(d.type==='learn'){
    h+=`<section class="sec"><h3>${ic('cards')} كلمات اليوم <small>اضغط للاستماع</small></h3><div class="wtable">${words.map(w=>`<div class="wrow">${sayBtn(w.en)}<div style="min-width:0"><div class="w">${esc(w.en)}</div><div class="p">${esc(w.pr)}</div></div><div class="a">${esc(w.ar)}</div></div>`).join('')}</div></section>
    <section class="sec"><h3>${ic('target')} وش تسوي بهالكلمات؟</h3><div class="note"><ol class="steps">
      <li>اسمع كل كلمة وقلها بصوت عالي ٣ مرات (بطاقات الكلمات).</li>
      <li>العب التوصيل والاستماع والكتابة عشان تثبت المعنى والشكل والصوت.</li>
      <li>ركّب الجمل واسمع القصة، هنا تشوف الكلمات وهي تشتغل في كلام حقيقي.</li>
      <li>اكتب في دفترك ٣ جمل من حياتك فيها كلمات اليوم.</li>
      <li>قبل النوم: غطِّ العمود العربي وحاول تتذكر معنى كل كلمة.</li></ol></div></section>`;
  } else {
    h+=`<section class="sec"><h3>${ic('cards')} الكلمات المشمولة <small>${words.length} كلمة</small></h3><div class="note"><p>${d.type==='review'?'اليوم ما فيه كلمات جديدة. نثبّت كلمات الأسبوع كلها قبل ما نكمل، لأن المراجعة هي اللي تنقل الكلمة للذاكرة الطويلة.':'هذا الاختبار يجمع كل كلمات المستوى. إذا جبت ٨٠٪ أو أكثر ينفتح لك المستوى التالي. خذ وقتك.'}</p></div></section>`;
  }
  return h+`</div>`}

/* ---------- activities ---------- */
let A=null; // current activity state
function openAct(lv,n,id,extra){go({name:'act',lv,n,id,extra})}
function actShell(title,prog){return `<div class="shead"><div class="wrap"><button class="iconbtn" data-close="1" aria-label="إغلاق">${ic('close')}</button>${prog!=null?`<div class="prog"><i style="width:${prog}%"></i></div>`:`<h3>${title}</h3>`}</div></div><div class="wrap sbody" id="actBody"></div>`}
function runAct(){const {lv,n,id}=view;const sh=$('#actSheet');const d=LV[lv].days[n-1];
  const words=view.extra==='hard'?Object.keys(S.hard).map(k=>W[k]).filter(Boolean):wordsFor(lv,n);
  A={lv,n,id,d,words,xp:0,right:0,wrong:0,hardMode:view.extra==='hard'};
  ({rule:actRule,cards:actCards,match:actMatch,listen:actListen,spell:actSpell,order:actOrder,story:actStory,speak:actSpeak,quiz:actQuiz,task:actTask})[id](sh)}
function finish(opts={}){const {lv,n,id,d}=A;TTS.stop();
  const ms=A.hardMode?[]:missionsFor(d);const m=ms.find(x=>x.id===id);const rec=dayRec(lv,n);let gained=0;
  if(A.hardMode){gained=10;addXP(gained)}
  else if(m){const first=!rec.m[id];if(id==='quiz'){if(opts.score>=80){gained=first?m.xp+(opts.stars||0)*5:5;rec.m[id]=1}else gained=0}else{gained=first?m.xp:3;rec.m[id]=1}if(gained)addXP(gained)}
  if(id==='quiz'&&!A.hardMode){rec.best=Math.max(rec.best||0,opts.score);rec.stars=Math.max(rec.stars||0,opts.stars||0)}
  Store.save();
  const passed=opts.score==null||opts.score>=80;
  if(passed)confetti();
  const sh=$('#actSheet');const next=!A.hardMode&&ms.find(x=>!rec.m[x.id]);
  let head=passed?'أحسنت!':'قربت! حاول مرة ثانية';
  if(id==='quiz'&&passed&&d.type==='exam')head=(lv==='l3'?'ختمت الخطة كاملة!':'انفتح لك المستوى التالي!');
  else if(id==='quiz'&&passed)head='اليوم الجاي انفتح!';
  sh.innerHTML=`<div class="wrap result">
    <div class="medal">${ic(passed?(id==='quiz'?'trophy':'check'):'loop')}</div><h2>${head}</h2>
    ${opts.stars!=null?`<div class="bigstars">${[1,2,3].map(k=>`<svg viewBox="0 0 24 24" class="${k<=opts.stars?'':'off'}">${P.star}</svg>`).join('')}</div>`:''}
    <div class="kpis"><div class="kpi"><b>+${gained}</b><small>نقطة</small></div>
    ${opts.score!=null?`<div class="kpi"><b>${opts.score}%</b><small>النتيجة</small></div>`:''}
    ${A.right+A.wrong?`<div class="kpi"><b>${A.right}/${A.right+A.wrong}</b><small>إجابات صحيحة</small></div>`:''}
    <div class="kpi"><b>${S.streak}</b><small>أيام متتالية</small></div></div>
    ${!passed?`<p style="color:var(--muted)">راجع البطاقات مرة ثانية ثم أعد الاختبار. الكلمات اللي غلطت فيها انحفظت في «كلماتي الصعبة».</p>`:''}
    <div style="display:grid;gap:12px;width:100%;margin-top:10px">
      ${!passed?`<button class="btn" data-again="1">أعد المحاولة</button>`:next?`<button class="btn" data-act="${next.id}">المهمة التالية: ${next.t}</button>`:''}
      <button class="btn ghost" data-backday="1">${A.hardMode?'رجوع للرئيسية':'رجوع لصفحة اليوم'}</button></div></div>`}

function feedback(ok,correctHTML,onNext){
  let fb=$('.fb');if(!fb){fb=document.createElement('div');fb.className='fb';document.body.appendChild(fb)}
  fb.className='fb '+(ok?'ok':'bad');
  fb.innerHTML=`<div class="wrap"><h4>${ok?pick(['ممتاز!','صح عليك!','رهيب!','بالضبط!'],1)[0]:'الإجابة الصحيحة:'}</h4>${!ok&&correctHTML?`<div class="corr">${correctHTML}</div>`:''}<button class="btn ${ok?'ok':'bad'}" id="fbNext">متابعة</button></div>`;
  requestAnimationFrame(()=>fb.classList.add('show'));
  $('#fbNext').onclick=()=>{fb.classList.remove('show');onNext()};
  $('#fbNext').focus({preventScroll:true});
}
const hideFb=()=>{const fb=$('.fb');if(fb)fb.classList.remove('show')};

/* rule */
function actRule(sh){const r=A.d.rule;const lvl=A.lv==='l1'?'قاعدة نطق':'قاعدة اليوم';
  sh.innerHTML=actShell(lvl);
  $('#actBody').innerHTML=`<div class="rule"><p class="dayhead"><span class="kick">${lvl}</span></p><h2>${esc(r.t)}</h2><p class="x">${esc(r.x)}</p>
  <div class="exs">${r.ex.map(e=>`<div class="ex">${sayBtn(e[0])}<div class="tx"><div class="e">${esc(e[0])}</div><small>${esc(e[1])}${e[2]?' · النطق: '+esc(e[2]):''}</small></div><button class="play" data-say="${esc(e[0])}" data-slow="1" aria-label="ببطء">${ic('slow')}</button></div>`).join('')}</div>
  <div class="note gold" style="margin-top:16px"><p><b>تمرين:</b> اضغط كل مثال، اسمعه، ثم قله بصوت عالي مرتين. زر السلحفاة يشغّل النطق ببطء.</p></div>
  <div class="foot"><button class="btn" id="done">فهمت القاعدة</button></div></div>`;
  $('#done').onclick=()=>finish()}

/* flashcards */
function actCards(sh){const ws=A.words;let i=0,reps=0;const hideArFront=!showAr(A.lv,'cards');const need=(A.d.type==='learn'&&!A.hardMode)?3:1;
  sh.innerHTML=actShell('',0);
  const draw=()=>{const w=ws[i];reps=0;sh.querySelector('.prog i').style.width=(i/ws.length*100)+'%';
    $('#actBody').innerHTML=`<p style="text-align:center;color:var(--muted);font-weight:800">بطاقة ${arNum(i+1)} من ${arNum(ws.length)}</p>
    <div class="card3d"><div class="fc" id="fc"><div class="face"><div class="big">${esc(w.en)}</div><div class="pr">${esc(w.pr)}</div>
      ${hideArFront?'':`<div style="font-size:20px;font-weight:800;color:var(--lv)">${esc(w.ar)}</div>`}
      <div class="row2" style="gap:12px;flex:none"><button class="speaker sm" data-say="${esc(w.en)}" aria-label="استمع">${ic('play')}</button><button class="speaker sm" style="background:var(--surface);color:var(--lv);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)" data-say="${esc(w.en)}" data-slow="1" aria-label="ببطء">${ic('slow')}</button></div>
      <span class="hint">اضغط البطاقة عشان تقلبها</span></div>
      <div class="face back"><div class="arb">${esc(w.ar)}</div><div class="big" style="font-size:26px">${esc(w.en)}</div><span class="hint">اضغط عشان ترجع</span></div></div></div>
    <p style="text-align:center;margin-top:18px;font-weight:800">${need===3?'اسمع وقلها بصوت عالي ٣ مرات':'اسمع، تذكّر المعنى، وقلها بصوت عالي'}</p>
    <div class="dots">${'<i></i>'.repeat(need)}</div>
    <div class="foot"><button class="btn" id="rep">${ic('mic')} قلتها بصوتي</button></div>`;
    TTS.say(w.en);
    $('#fc').onclick=e=>{if(e.target.closest('button'))return;$('#fc').classList.toggle('flip')};
    $('#rep').onclick=()=>{reps++;document.querySelectorAll('.dots i').forEach((d,k)=>d.classList.toggle('on',k<reps));
      if(A.hardMode&&reps===need)easeHard(w);
      if(reps<need){TTS.say(w.en)}else{i++;if(i>=ws.length){sh.querySelector('.prog i').style.width='100%';finish()}else setTimeout(draw,250)}}};
  draw()}

/* match */
function actMatch(sh){const all=shuffle(A.words);const per=6;const rounds=A.d.type==='learn'?2:3;let r=0,t0=Date.now(),miss=0,timer;
  sh.innerHTML=actShell('',0);
  const draw=()=>{const set=all.slice(r*per,r*per+per).length>=3?all.slice(r*per,r*per+per):pick(all,per);let left=set.length,sel=null;
    sh.querySelector('.prog i').style.width=(r/rounds*100)+'%';
    const en=shuffle(set),ar=shuffle(set);
    $('#actBody').innerHTML=`<p class="qprompt"><span class="lbl" style="display:block">الجولة ${arNum(r+1)} من ${arNum(rounds)}: وصّل الكلمة بمعناها</span></p>
     <div class="stat"><span id="tm">0s</span><span style="color:var(--bad)">✕ <b id="ms">${miss}</b></span></div>
     <div class="match"><div class="col">${en.map(w=>`<button class="tile en" data-k="${w.id}" data-s="en">${esc(w.en)}</button>`).join('')}</div>
     <div class="col">${ar.map(w=>`<button class="tile" data-k="${w.id}" data-s="ar">${esc(w.ar)}</button>`).join('')}</div></div>`;
    $('#actBody').onclick=e=>{const b=e.target.closest('.tile');if(!b||b.classList.contains('gone'))return;
      if(b.dataset.s==='en')TTS.say(W[b.dataset.k].en);
      if(!sel||sel.dataset.s===b.dataset.s){document.querySelectorAll('.tile.sel').forEach(x=>x.classList.remove('sel'));sel=b;b.classList.add('sel');return}
      if(sel.dataset.k===b.dataset.k){[sel,b].forEach(x=>{x.classList.remove('sel');x.classList.add('gone')});A.right++;sel=null;left--;
        if(!left){r++;if(r>=rounds){clearInterval(timer);finish()}else setTimeout(draw,300)}}
      else{miss++;A.wrong++;addHard(W[sel.dataset.s==='en'?sel.dataset.k:b.dataset.k]);$('#ms').textContent=miss;[sel,b].forEach(x=>{x.classList.remove('sel');x.classList.add('shake');setTimeout(()=>x.classList.remove('shake'),400)});sel=null}}};
  timer=setInterval(()=>{const t=$('#tm');if(!t){clearInterval(timer);return}t.textContent=Math.round((Date.now()-t0)/1000)+'s'},500);
  draw()}

/* listen & choose */
function actListen(sh){const own=A.words;const count=A.d.type==='learn'?8:10;
  let qs=pick(own,A.d.type==='learn'?6:count);if(A.d.type==='learn')qs=qs.concat(prevWords(A.lv,A.n,2));qs=shuffle(qs);
  if(A.hardMode)qs=pick(own,Math.min(10,own.length));
  let i=0;sh.innerHTML=actShell('',0);
  const pool=A.hardMode?ALLW:own.length>=4?own:ALLW;
  const draw=()=>{const w=qs[i];sh.querySelector('.prog i').style.width=(i/qs.length*100)+'%';const mode=i%2?'ar':'en';
    const opts=shuffle([w].concat(pick(pool.filter(x=>x.id!==w.id&&x.en!==w.en&&x.ar!==w.ar),3)));
    $('#actBody').innerHTML=`<div class="qprompt"><p class="lbl">${mode==='en'?'اسمع واختر الكلمة المكتوبة':'اسمع واختر المعنى'}</p>
     <button class="speaker" data-say="${esc(w.en)}" aria-label="استمع">${ic('play')}</button>
     <div style="margin-top:12px"><button class="tg" data-say="${esc(w.en)}" data-slow="1">${ic('slow')} ببطء</button></div></div>
     <div class="opts two">${opts.map(o=>`<button class="opt ${mode==='en'?'en':''}" data-k="${o.id}">${esc(mode==='en'?o.en:o.ar)}</button>`).join('')}</div>`;
    setTimeout(()=>TTS.say(w.en),250);
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.opt').forEach(x=>x.disabled=true);const ok=b.dataset.k===w.id;
      b.classList.add(ok?'right':'wrong');document.querySelector(`.opt[data-k="${w.id}"]`).classList.add('right');
      if(ok){A.right++;if(A.hardMode)easeHard(w)}else{A.wrong++;addHard(w)}
      feedback(ok,`<span class="en">${esc(w.en)}</span> = ${esc(w.ar)}`,()=>{i++;if(i>=qs.length)finish();else draw()})})};
  draw()}

/* spelling */
const norm=s=>s.toLowerCase().replace(/[’`]/g,"'").replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();
function actSpell(sh){const own=A.words;const n=A.d.type==='learn'?6:8;let qs=pick(own,Math.min(n,own.length));let i=0;
  sh.innerHTML=actShell('',0);
  const draw=()=>{const w=qs[i];sh.querySelector('.prog i').style.width=(i/qs.length*100)+'%';let hint=0;
    const clean=w.en.replace(/\s*\(.*\)$/,'');
    $('#actBody').innerHTML=`<div class="qprompt"><p class="lbl">اسمع واكتب الكلمة بالإنجليزي</p>
      <button class="speaker" data-say="${esc(clean)}" aria-label="استمع">${ic('play')}</button>
      <p style="margin-top:12px;color:var(--muted)">المعنى: <b style="color:var(--ink)">${esc(w.ar)}</b></p></div>
      <input class="inp" id="sp" autocomplete="off" autocapitalize="off" spellcheck="false" autocorrect="off" aria-label="اكتب الكلمة">
      <div class="blanks" id="bl">${clean.replace(/[A-Za-z']/g,'_ ')}</div>
      <div class="row2" style="margin-top:16px"><button class="btn ghost sm" id="hint">تلميح: حرف</button><button class="btn ghost sm" data-say="${esc(clean)}" data-slow="1">${ic('slow')} ببطء</button></div>
      <div class="foot"><button class="btn" id="chk">تحقق</button></div>`;
    setTimeout(()=>TTS.say(clean),250);const inp=$('#sp');inp.focus({preventScroll:true});
    $('#hint').onclick=()=>{hint=Math.min(clean.length,hint+1);inp.value=clean.slice(0,hint);inp.focus()};
    const check=()=>{const ok=norm(inp.value)===norm(clean)||norm(inp.value).replace(/'/g,'')===norm(clean).replace(/'/g,'');
      inp.disabled=true;$('#chk').disabled=true;if(ok){A.right++;if(A.hardMode)easeHard(w)}else{A.wrong++;addHard(w)}
      feedback(ok,`<span class="en" style="font-size:22px;font-weight:800">${esc(clean)}</span>`,()=>{i++;if(i>=qs.length)finish();else draw()})};
    $('#chk').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value.trim())check()}};
  draw()}

/* sentence order */
function orderQ(s,host,onDone){const toks=s[0].split(' ');const bank=shuffle(toks.map((t,k)=>({t,k})));let ans=[];
  host.innerHTML=`<div class="qprompt"><p class="lbl">رتّب الكلمات عشان تكوّن الجملة</p><p class="arbig" style="font-size:22px">${esc(s[1])}</p></div>
    <div class="answer" id="ans"></div><div class="bank" id="bank">${bank.map((b,j)=>`<button class="wtile" data-j="${j}">${esc(b.t)}</button>`).join('')}</div>
    <div class="foot"><button class="btn" id="chk" disabled>تحقق</button></div>`;
  const paint=()=>{$('#ans').innerHTML=ans.map((j,p)=>`<button class="wtile" data-p="${p}">${esc(bank[j].t)}</button>`).join('');
    document.querySelectorAll('#bank .wtile').forEach(b=>b.classList.toggle('used',ans.includes(+b.dataset.j)));$('#chk').disabled=ans.length!==toks.length};
  $('#bank').onclick=e=>{const b=e.target.closest('.wtile');if(!b||b.classList.contains('used'))return;ans.push(+b.dataset.j);TTS.say(bank[+b.dataset.j].t.replace(/[^A-Za-z']/g,''));paint()};
  $('#ans').onclick=e=>{const b=e.target.closest('.wtile');if(!b)return;ans.splice(+b.dataset.p,1);paint()};
  $('#chk').onclick=()=>{const got=ans.map(j=>bank[j].t).join(' ');const ok=norm(got)===norm(s[0]);$('#chk').disabled=true;TTS.say(s[0]);onDone(ok,`<span class="en">${esc(s[0])}</span>`)}}
function actOrder(sh){const ss=shuffle(A.d.sents);let i=0;sh.innerHTML=actShell('',0);
  const draw=()=>{sh.querySelector('.prog i').style.width=(i/ss.length*100)+'%';orderQ(ss[i],$('#actBody'),(ok,c)=>{ok?A.right++:A.wrong++;feedback(ok,c,()=>{i++;if(i>=ss.length)finish();else draw()})})};draw()}

/* story */
function actStory(sh){const lines=A.d.story;let showEn=true,showA=showAr(A.lv,'story'),playing=false,stopFlag=false;
  const voiceOf=l=>/^B:|^Patient:/.test(l)?1:0;
  sh.innerHTML=actShell('قصة اليوم');
  const paint=()=>{$('#actBody').innerHTML=`<div class="note gold"><ol class="steps">
      <li>اضغط «شغّل القصة» واسمع بدون ما تقرأ (أخفِ النص).</li><li>اسمعها مرة ثانية وأنت تقرأ النص الإنجليزي.</li><li>شغّل الترجمة وتأكد إنك فهمت كل سطر، ثم اضغط كل سطر ورده بصوتك.</li></ol></div>

/* quiz */
function buildQuiz(){const {d,lv,n}=A;const own=A.words;const pool=own.length>=4?own:ALLW;const qs=[];
  const distract=(w,k=3,src=pool)=>pick(src.filter(x=>x.id!==w.id&&x.en!==w.en&&x.ar!==w.ar),k);
  const add=(type,w,extra)=>qs.push(Object.assign({type,w},extra||{}));
  if(d.type==='learn'){const ws=shuffle(own);let rev=prevWords(lv,n,2);if(rev.length<2)rev=[ws[6],ws[7]];
    add('mean',ws[0]);add('mean',ws[1]);add('mean',rev[0]);add('rev',ws[2]);add('rev',ws[3]);add('listen',ws[4]);add('listen',rev[1]);add('spell',ws[5]);
    add('order',null,{s:pick(d.sents,1)[0]});
    const fill=fillFrom(d.sents,own);fill?qs.push(fill):add('mean',ws[6]);
  } else {const N=d.type==='review'?15:20;const ws=pick(own,N);
    const types=['mean','rev','listen','mean','spell','rev','listen','mean','fill','order'];
    const learnDays=d.type==='review'?LV[lv].days.slice(n-7,n-1).filter(x=>x.type==='learn'):LV[lv].days.filter(x=>x.type==='learn');
    ws.forEach((w,k)=>{const t=types[k%types.length];
      if(t==='order'){add('order',null,{s:pick(pick(learnDays,1)[0].sents,1)[0]})}
      else if(t==='fill'){const dd=pick(learnDays,1)[0];const f=fillFrom(dd.sents,dd.wl);f?qs.push(f):add('mean',w)}
      else add(t,w)})}
  qs.forEach(q=>{if(q.w&&(q.type==='mean'||q.type==='rev'||q.type==='listen'))q.opts=shuffle([q.w].concat(distract(q.w)))});
  return qs}
function fillFrom(sents,wl){for(const s of shuffle(sents)){for(const w of shuffle(wl)){if(/[\s()]/.test(w.en))continue;const re=new RegExp('\\b'+w.en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
      if(re.test(s[0])){const others=pick(wl.filter(x=>x.id!==w.id&&!/\s/.test(x.en)),3);if(others.length<3)continue;return {type:'fill',w,s,text:s[0].replace(re,'_____'),opts:shuffle([w].concat(others))}}}}return null}
function actQuiz(sh){const qs=buildQuiz();let i=0,score=0;sh.innerHTML=actShell('',0);
  const done=()=>{const pct=Math.round(score/qs.length*100);const stars=pct>=100?3:pct>=90?2:pct>=80?1:0;finish({score:pct,stars})};
  const next=()=>{i++;if(i>=qs.length)done();else draw()};
  const res=(ok,w,c)=>{if(ok){score++;A.right++;if(w)easeHard(w)}else{A.wrong++;if(w)addHard(w)}feedback(ok,c,next)};
  const draw=()=>{const q=qs[i],w=q.w,body=$('#actBody');sh.querySelector('.prog i').style.width=(i/qs.length*100)+'%';
    const optBtns=(field,isEn)=>`<div class="opts two">${q.opts.map(o=>`<button class="opt ${isEn?'en':''}" data-k="${o.id}">${esc(o[field])}</button>`).join('')}</div>`;
    const bindOpts=c=>document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.opt').forEach(x=>x.disabled=true);const ok=b.dataset.k===w.id;b.classList.add(ok?'right':'wrong');document.querySelector(`.opt[data-k="${w.id}"]`).classList.add('right');if(q.type!=='rev')TTS.say(w.en);res(ok,w,c)});
    const tag=`<p style="text-align:center;color:var(--muted);font-weight:800;margin-bottom:6px">سؤال ${arNum(i+1)} من ${arNum(qs.length)}</p>`;
    if(q.type==='mean'){body.innerHTML=tag+`<div class="qprompt"><p class="lbl">وش معنى هذي الكلمة؟</p><p class="big">${esc(w.en)}</p><button class="tg" style="margin-top:8px" data-say="${esc(w.en)}">${ic('play')} استمع</button></div>`+optBtns('ar');bindOpts(`<span class="en">${esc(w.en)}</span> = ${esc(w.ar)}`)}
    else if(q.type==='rev'){body.innerHTML=tag+`<div class="qprompt"><p class="lbl">اختر الكلمة الإنجليزية لـ</p><p class="arbig">${esc(w.ar)}</p></div>`+optBtns('en',true);bindOpts(`${esc(w.ar)} = <span class="en">${esc(w.en)}</span>`)}
    else if(q.type==='listen'){body.innerHTML=tag+`<div class="qprompt"><p class="lbl">اسمع واختر المعنى</p><button class="speaker" data-say="${esc(w.en)}" aria-label="استمع">${ic('play')}</button></div>`+optBtns('ar');setTimeout(()=>TTS.say(w.en),250);bindOpts(`<span class="en">${esc(w.en)}</span> = ${esc(w.ar)}`)}
    else if(q.type==='fill'){body.innerHTML=tag+`<div class="qprompt"><p class="lbl">اختر الكلمة المناسبة للفراغ</p><p class="big" style="font-size:clamp(20px,5.5vw,26px);line-height:1.5">${esc(q.text)}</p><p style="color:var(--muted);margin-top:6px">${esc(q.s[1])}</p></div>`+optBtns('en',true);bindOpts(`<span class="en">${esc(q.s[0])}</span>`)}
    else if(q.type==='spell'){const clean=w.en.replace(/\s*\(.*\)$/,'');body.innerHTML=tag+`<div class="qprompt"><p class="lbl">اسمع واكتب</p><button class="speaker" data-say="${esc(clean)}">${ic('play')}</button><p style="margin-top:10px;color:var(--muted)">المعنى: <b style="color:var(--ink)">${esc(w.ar)}</b></p></div><input class="inp" id="sp" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="اكتب"><div class="blanks">${clean.replace(/[A-Za-z']/g,'_ ')}</div><div class="foot"><button class="btn" id="chk">تحقق</button></div>`;
      setTimeout(()=>TTS.say(clean),250);const inp=$('#sp');inp.focus({preventScroll:true});const ck=()=>{inp.disabled=true;$('#chk').disabled=true;res(norm(inp.value).replace(/'/g,'')===norm(clean).replace(/'/g,''),w,`<span class="en" style="font-size:22px;font-weight:800">${esc(clean)}</span>`)};$('#chk').onclick=ck;inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value.trim())ck()}}
    else if(q.type==='order'){const host=document.createElement('div');body.innerHTML=tag;body.appendChild(host);orderQ(q.s,host,(ok,c)=>res(ok,null,c))}
  };
  draw()}
