/* ---------- settings ---------- */
function voicePick(key,label,list,cur,second){if(!list.length)return '';
  return `<label style="display:block;font-weight:700;font-size:14px;margin:10px 0 6px" for="sel-${key}">${label}</label><div style="display:flex;gap:8px"><select id="sel-${key}" data-voice="${key}" style="flex:1;min-width:0;font:inherit;font-family:var(--en);padding:9px 10px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)">${list.map(v=>`<option value="${esc(v.name)}" ${cur&&cur.name===v.name?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select><button class="play" data-testv="${second?1:0}" aria-label="جرّب">${ic('play')}</button></div>`}
function setHTML(){const s=S.set;const opt=(k,v,t)=>`<button class="tg" data-set="${k}" data-v="${v}" aria-pressed="${s[k]===v}">${t}</button>`;
  const noVoice=!('speechSynthesis' in window)||(TTS.ready&&!TTS.pickVoices().length);
  return `<div class="shead"><div class="wrap"><button class="iconbtn" data-go="home" aria-label="رجوع">${ic('back')}</button><h3>الإعدادات</h3></div></div>
  <div class="wrap sbody set">
   ${Auth.on?`<div class="setrow"><b>حسابك</b>${Auth.user?`<p style="margin-bottom:10px">مسجّل باسم <b class="en" style="color:var(--ink)">${esc(Auth.user.email||Auth.user.displayName||'')}</b>. تقدمك ينحفظ تلقائياً على حسابك.</p><button class="btn ghost sm" id="signout">تسجيل الخروج</button>`:`<p>سجّل دخول عشان ينحفظ تقدمك وتكمّل من أي جهاز.</p><button class="btn sm" data-go="login">تسجيل الدخول</button>`}</div>`:''}
   <div class="setrow"><b>الترجمة العربية</b><p>«تلقائي» يخفف الترجمة كل ما تقدمت في المستويات، وهو المنصوح فيه.</p><div class="toggles">${opt('tr','auto','تلقائي')}${opt('tr','on','دائماً ظاهرة')}${opt('tr','off','مخفية')}</div></div>
   <div class="setrow"><b>سرعة الصوت</b><div class="toggles">${opt('rate','n','عادية')}${opt('rate','s','أبطأ شوي')}</div></div>
   <div class="setrow"><b>الأصوات</b><p>الصوت الأساسي يقرأ الكلمات والجمل، والصوت الثاني هو الشخص الثاني في الحوارات (رجل).</p>${voicePick('vA','الصوت الأساسي',TTS.english(),TTS.mainVoice())}${voicePick('vB','الصوت الثاني (رجل)',TTS.male().length?TTS.male():TTS.english(),TTS.secondVoice(),1)}
     <p style="margin-top:10px;font-size:13px">لأوضح صوت على الماك أو الآيفون: الإعدادات ← تسهيلات الاستخدام ← المحتوى المنطوق ← الصوت ← أضف صوت إنجليزي «Enhanced» أو «Premium» (مثل Evan أو Nathan للرجل، وAva أو Zoe للمرأة)، ثم ارجع هنا واختاره.</p></div>
   <div class="setrow"><b>اللهجة</b><div class="toggles">${opt('accent','us','أمريكية')}${opt('accent','uk','بريطانية')}</div>
     <button class="btn ghost sm" data-say="Hello! Welcome to your English trail." style="margin-top:4px">${ic('play')} جرّب الصوت</button>
     ${noVoice?`<p class="warnvoice">ما لقيت صوت إنجليزي في جهازك. في الآيفون والماك الأصوات موجودة تلقائياً، وفي الأندرويد نزّل «Google Text-to-Speech».</p>`:''}</div>
   <div class="setrow"><b>فتح كل الأيام</b><p>افتراضياً كل يوم ينفتح بعد ما تنجح في اختبار اليوم اللي قبله. فعّل هذا لو تبي تتنقل بحرية.</p><div class="toggles">${opt('unlock',false,'بالترتيب')}${opt('unlock',true,'كل الأيام مفتوحة')}</div></div>
   <div class="setrow"><b>إحصائياتك</b><p style="margin:0">مجموع النقاط: <b class="en">${S.xp}</b> · السلسلة الحالية: <b class="en">${S.streak}</b> · أطول سلسلة: <b class="en">${S.best||0}</b></p></div>
   <div class="setrow"><b>البدء من جديد</b><p>يمسح كل تقدمك ونقاطك.</p><button class="btn bad sm" id="reset">امسح التقدم</button><div id="resetC"></div></div>
  </div>`}

/* ---------- global clicks ---------- */
document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.lv){const lv=t.dataset.lv;if(!levelOpen(lv)){toast('ينفتح هذا المستوى بعد ما تنجح في اختبار المستوى اللي قبله (أو فعّل «فتح كل الأيام» من الإعدادات)');return}S.cur=lv;Store.save();go({name:'home'});return}
  if(t.dataset.day){const n=+t.dataset.day;const lv=S.cur;if(!dayOpen(lv,n)){toast('خلّص اختبار اليوم اللي قبله أول بنسبة ٨٠٪');return}go({name:'day',lv,n,scroll:scrollY});return}
  if(t.dataset.go){const g=t.dataset.go;if(g==='home'){go({name:'home',scroll:view.scroll||0})}else go({name:g,scroll:scrollY});return}
  if(t.dataset.act){const lv=view.lv,n=view.n;hideFb();openAct(lv,n,t.dataset.act);return}
  if(t.dataset.close||t.dataset.backday){hideFb();if(A&&A.hardMode)go({name:'home'});else go({name:'day',lv:view.lv,n:view.n,scroll:view.scroll});return}
  if(t.dataset.again){hideFb();openAct(view.lv,view.n,view.id,view.extra);return}
  if(t.dataset.hard){if(!Object.keys(S.hard).length)return;const ks=Object.keys(S.hard);const lv=W[ks[0]].lv;go({name:'act',lv,n:W[ks[0]].day,id:ks.length>=4?'listen':'cards',extra:'hard'});return}
  if(t.dataset.set){let v=t.dataset.v;if(v==='true')v=true;if(v==='false')v=false;S.set[t.dataset.set]=v;Store.save();render();return}
  if(t.id==='signout'){await Auth.out();toast('سجّلت خروج');go({name:'home'});return}
  if(t.id==='reset'){$('#resetC').innerHTML=`<p style="margin-top:10px;color:var(--bad)">متأكد؟ ما تقدر ترجع التقدم بعدين.</p><button class="btn bad sm" id="reset2">نعم، امسح كل شي</button>`;return}
  if(t.id==='reset2'){const set=S.set;S=fresh();S.set=set;Store.save();toast('انمسح التقدم');go({name:'home'});return}
});

document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.voice){S.set[t.dataset.voice]=t.value;Store.save();TTS.say(t.dataset.voice==='vB'?'Hi, I am the second speaker.':'Hello! Welcome to your English trail.',{voice:t.dataset.voice==='vB'?1:0})}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-testv]');if(b)TTS.say(b.dataset.testv==='1'?'Hi, I am the second speaker.':'Hello! Welcome to your English trail.',{voice:+b.dataset.testv})});
Store.init();
if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>

</body>
</html>
